<h2>Cambiar tu contraseña</h2>
<p>Hemos recibido una petición para cambiar la contraseña de tu cuenta.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/cuenta/contrasena">Elegir una contraseña nueva</a></p>
<p>Si no lo has pedido tú, ignora este correo: tu contraseña no cambiará.</p>
